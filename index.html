<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Codebreaker</title>
<meta name="theme-color" content="#0a0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Codebreaker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0a0e14; --panel:#111823; --panel2:#172130; --line:#233142; --text:#e8eef5; --muted:#8a9bb1;
  --hit:#2ee59d; --near:#ffb547; --accent:#5cc8ff; --danger:#ff5c7a;
  --p0:#5cc8ff; --p1:#ff7ac6;
  --mono:ui-monospace,"Roboto Mono","Droid Sans Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input{font:inherit}
body{touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:1100px;margin:0 auto;padding:14px 16px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.center{align-items:center;justify-content:center;justify-content:safe center;text-align:center}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.p0{color:var(--p0)} .p1{color:var(--p1)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:14px;
  background:var(--panel2);border:1px solid var(--line);font-weight:650;font-size:17px;width:100%}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#04121d;border-color:transparent}
.btn.hit{background:var(--hit);color:#03170e;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.35;pointer-events:none}
.stack{display:flex;flex-direction:column;gap:12px;width:100%;max-width:420px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);font-size:20px}

/* logo */
.logo{font-weight:800;letter-spacing:.18em;font-size:clamp(30px,8vw,48px)}
.logo span{color:var(--hit)}
.logopegs{display:grid;grid-template-columns:repeat(2,26px);gap:10px;margin:0 auto 22px}
.tag{margin:10px 0 30px;font-size:16px}

/* pegs */
.pegs{display:grid;grid-template-columns:repeat(2,var(--pg,15px));gap:5px;flex:none}
.peg{width:var(--pg,15px);height:var(--pg,15px);border-radius:50%;background:#1d2835}
.peg.hit{background:var(--hit);box-shadow:0 0 10px rgba(46,229,157,.55)}
.peg.near{background:transparent;border:3.5px solid var(--near);box-shadow:0 0 8px rgba(255,181,71,.35)}
.new .peg{animation:pop .4s both}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:6px}
.legend i.hit{background:var(--hit)} .legend i.near{border:3px solid var(--near)}

/* tiles / input */
.slots{display:flex;gap:10px;justify-content:center}
.tile{width:clamp(52px,15vw,70px);height:clamp(60px,17vw,80px);border-radius:14px;background:var(--panel2);border:2px solid var(--line);
  display:grid;place-items:center;font:700 clamp(28px,8vw,40px)/1 var(--mono)}
.tile.cur{border-color:var(--accent);box-shadow:0 0 0 4px rgba(92,200,255,.18)}
.tile.cur:empty::after{content:"";width:3px;height:45%;background:var(--accent);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tile.dot{font-size:20px}
.msg{min-height:22px;text-align:center;font-size:14px;margin:8px 0 4px;color:var(--danger)}
.msg.info{color:var(--near)} .msg.ok{color:var(--muted)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* keypad */
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{height:clamp(44px,6.2vh,64px);border-radius:14px;background:var(--panel2);border:1px solid var(--line);
  font:600 26px var(--mono);position:relative}
.key:active{transform:scale(.95);background:#22324a}
.key.out{opacity:.3;text-decoration:line-through}
.key.in{border-color:var(--hit);color:var(--hit)}
.key.go{background:var(--accent);color:#04121d;border-color:transparent;font:700 18px system-ui,sans-serif}
.key.back{font-size:22px}
.key[disabled]{opacity:.25;pointer-events:none}

/* notes */
.toolhead{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.toolhead button{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:4px 0}
.notes{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-bottom:10px}
.chip{height:34px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font:600 17px var(--mono)}
.chip.s1{opacity:.4;text-decoration:line-through;color:var(--danger);border-color:transparent}
.chip.s2{background:rgba(46,229,157,.14);border-color:var(--hit);color:var(--hit)}
.grid{display:grid;grid-template-columns:44px repeat(10,1fr);gap:4px;align-items:center}
.grid .lab{font-size:12px;color:var(--muted);text-align:center}
.cell{height:34px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font:600 15px var(--mono);color:var(--muted)}
.cell.s1{background:rgba(255,92,122,.1);border-color:rgba(255,92,122,.35);color:var(--danger)}
.cell.s2{background:rgba(46,229,157,.14);border-color:var(--hit);color:var(--hit)}

/* play layout */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.topbar .t{flex:1;min-width:0}
.topbar .t h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t div{font-size:13px;color:var(--muted);margin-top:2px}
.peek{height:44px;padding:0 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--muted);min-width:92px}
.peek.on{color:var(--text);font:700 18px var(--mono);letter-spacing:.15em}
.opp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.opp b{color:var(--text);font-weight:600}
.opp .pegs{--pg:10px;gap:3px;margin-left:auto}
.play{flex:1;min-height:0;display:flex;flex-direction:column}
.play .left{flex:1;min-height:0;display:flex;flex-direction:column}
.histwrap{flex:1;min-height:90px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
.history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px;margin-top:8px}
.row{display:flex;align-items:center;gap:12px;padding:6px 10px;border-radius:12px;background:var(--panel2)}
.row .n{width:22px;color:var(--muted);font-size:13px;text-align:right;flex:none}
.row .d{display:flex;gap:6px}
.row .d span{width:34px;height:38px;border-radius:9px;background:#0e141d;display:grid;place-items:center;font:700 22px var(--mono)}
.row .zero{font-size:11px;color:var(--muted);margin-left:auto;text-transform:uppercase;letter-spacing:.06em}
.row .zero + .pegs{margin-left:0}
.row .pegs{margin-left:auto}
.row.win{background:rgba(46,229,157,.12);outline:1px solid var(--hit)}
.row.new{animation:slidein .3s both}
@keyframes slidein{from{opacity:0;transform:translateY(8px)}}
.wideflex{display:none}
.row .d span.hd{cursor:pointer}
.row .d span.s1{opacity:.35;text-decoration:line-through;color:var(--danger)}
.row .d span.s2{color:var(--hit);box-shadow:inset 0 0 0 2px var(--hit)}
.tip{font-size:12px;color:var(--muted);text-align:center;padding-top:8px}
.npane{gap:8px;margin-top:8px}
.minis{display:flex;flex-wrap:wrap;gap:6px;flex:none}
.mg{display:flex;align-items:center;gap:7px;background:var(--panel2);border-radius:9px;padding:5px 8px;font:700 15px var(--mono);letter-spacing:.06em}
.mg i{font-style:normal}
.mg i.s1{opacity:.35;text-decoration:line-through;color:var(--danger)}
.mg i.s2{color:var(--hit)}
.mg .pegs{--pg:8px;gap:2px}
.ntable{display:grid;grid-template-columns:62px repeat(4,1fr);gap:5px;align-items:center;flex:none}
.ntable .lab{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.nd{height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font:700 18px var(--mono);display:flex;align-items:center;justify-content:center;gap:5px}
.nd small{font-size:13px}
.nd.s1{color:var(--danger);opacity:.6}
.nd.s2{color:var(--hit);border-color:var(--hit);background:rgba(46,229,157,.14)}
.ntable .cell{height:34px;font-size:16px}
.ntable .cell.dim{opacity:.3}
.backbar{min-height:48px;margin-top:2px}
.nfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);line-height:1.4;flex:none;padding-bottom:4px}
.nfoot button{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.06em;flex:none}
.empty{margin:auto;text-align:center;color:var(--muted);font-size:14px;padding:20px;line-height:1.5}
.assist{font-size:13px;color:var(--near);text-align:center;margin-top:8px}
.controls{flex:none;padding-top:12px}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 0 8px}
.seg button{flex:1;height:36px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--panel2);color:var(--text)}
.result{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center}
.result .big{display:flex;justify-content:center;gap:26px;margin:4px 0 14px;font-size:15px}
.result .big div{display:flex;flex-direction:column;align-items:center;gap:6px}
.result .big strong{font:800 30px var(--mono)}
.wideonly{display:none}

@media (min-width:720px){
  .play{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;min-height:0}
  .play .controls{padding-top:0;overflow-y:auto;min-height:0}
  .row .d span{width:44px;height:50px;font-size:26px}
  .row{--pg:18px;padding:9px 14px}
  .narrowonly{display:none !important}
  .wideflex{display:flex}
  .wideonly{display:block}
}
@media (max-height:700px) and (max-width:719px){
  .key{height:46px}
  .tile{height:54px;width:48px}
}

/* cover / handoff */
.cover{background:radial-gradient(circle at 50% 30%,#152235 0%,var(--bg) 70%)}
.avatar{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:40px;font-weight:800;margin:0 auto 18px;color:#07101a}
.cover h1{font-size:clamp(26px,7vw,38px);line-height:1.15}
.cover p{font-size:16px;color:var(--muted);max-width:360px;margin:12px auto 30px;line-height:1.5}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:13px;color:var(--muted)}
.field input{height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 14px;font-size:17px;outline:none;-webkit-user-select:text;user-select:text}
.field input:focus{border-color:var(--accent)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left}
.opt small{display:block;color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
.sw{width:52px;height:30px;border-radius:15px;background:#2a3748;position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--hit)} .sw.on::after{left:25px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.pagehead h2{font-size:22px}
.content{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-bottom:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;line-height:1.55;font-size:15px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{margin:6px 0}
.example{display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}
.example .row{flex:1;min-width:250px}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:20px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;animation:up .25s}
@media (min-width:720px){.veil{align-items:center}.sheet{border-radius:22px}}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:0}}

/* banner */
.banner{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:30}
.banner div{padding:18px 28px;border-radius:18px;background:rgba(17,24,35,.95);border:1px solid var(--line);font-size:24px;font-weight:800;animation:banner 1.3s both}
@keyframes banner{0%{opacity:0;transform:scale(.8)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* over */
.trophy{font-size:64px;margin-bottom:8px}
.codes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:18px 0}
.codes .card{min-width:150px;text-align:center}
.codes .code{font:800 30px var(--mono);letter-spacing:.2em;margin-top:6px}
.score{font-size:15px;color:var(--muted);margin-bottom:22px}
.score b{font:800 22px var(--mono);color:var(--text);margin:0 6px}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.boards{display:grid;gap:14px}
@media (min-width:720px){.boards{grid-template-columns:1fr 1fr}}
.boards .histwrap{min-height:0}

/* online */
.gamelist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.gitem .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#07101a;background:var(--p1);flex:none}
.gitem .gt{flex:1;min-width:0}
.gitem .gt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .gt small{color:var(--muted);font-size:13px}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:var(--panel2);color:var(--muted);flex:none;white-space:nowrap}
.badge.go{background:var(--hit);color:#03170e}
.joincode{font:800 clamp(40px,12vw,64px)/1.1 var(--mono);letter-spacing:.18em;color:var(--hit);margin:10px 0 4px}
.spin{width:16px;height:16px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:spin 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.waiting{margin:10px 0 6px;font-weight:600}
.minitabs{display:flex;gap:6px;margin-top:8px}
.minitabs button{flex:1;height:34px;border-radius:9px;background:var(--panel2);color:var(--muted);font-size:13px;font-weight:600;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.minitabs button.on{color:var(--text);border-color:var(--line);background:#1d2a3b}
.note{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--muted);line-height:1.45;text-align:left}
.note b{color:var(--text)}
.note .btn{margin-top:10px;min-height:44px;font-size:15px}
.sectionlabel{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:12px 2px 0}
.field input.code-in{text-transform:uppercase;letter-spacing:.3em;font-family:var(--mono);font-size:26px;text-align:center}
.err{color:var(--danger);font-size:14px;text-align:center;min-height:20px}
.opp.tap{cursor:pointer}
.opp.lastchance{background:rgba(255,181,71,.12);border-color:var(--near);color:var(--text)}
.opp.lastchance b{color:var(--near)}
.stiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:720px){.stiles{grid-template-columns:repeat(4,1fr)}}
.stile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stile b{font:800 24px var(--mono)}
.stile span{font-size:12px;color:var(--muted)}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.srow > div{flex:1;min-width:0}
.srow b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow small{color:var(--muted);font-size:12px}
.srow .when{flex:none;min-width:58px;text-align:right}
.wl{display:flex;width:84px;height:8px;border-radius:4px;overflow:hidden;background:var(--panel2);flex:none}
.wl i{display:block}
.clock{font-family:var(--mono);font-variant-numeric:tabular-nums}
.countdown{font:800 96px/1.1 var(--mono);color:var(--hit);margin:6px 0}
.homebadge{background:var(--hit);color:#03170e;border-radius:99px;font-size:12px;padding:3px 9px;font-weight:800}
</style>

<div id="app"></div>
<script>
'use strict';
const $app = document.getElementById('app');

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const settings = Object.assign({ repeats: true, sound: true, haptics: true, assist: false, aiLevel: 'normal' }, LS.get('cb.settings', {}));
let names = LS.get('cb.names', ['Player 1', 'Player 2']);
let wins = LS.get('cb.wins', {});          // name -> games won (pass-the-phone games)
let game = LS.get('cb.game', null);        // the current pass-the-phone game
let me = LS.get('cb.me', null);            // online identity: {id, secret, name}
const saveGame = () => game ? LS.set('cb.game', game) : LS.del('cb.game');
const saveSettings = () => LS.set('cb.settings', settings);

/* ---------- online config ---------- */
const API = 'https://qivhqwkkgvmkgmmguaqd.supabase.co';
const KEY = 'sb_publishable_je2bb5SaoGDB2YMFKU8ogw_Y_Y0kf2R';
const VAPID = 'BBPtmx9Y4AHGszo0Lc0gLQc7sqsRK8qZsAhYw8czKqalJeCX36NBI30XVuXsXSpghyfZZGrMMxiVUVXCjFHuvdU';
const SITE = 'https://nickjohn117.github.io/codebreaker/';

/* ---------- ui state (not persisted) ---------- */
const ui = { view: 'home', back: 'home', sheet: null, entry: [null, null, null, null], cursor: 0,
  msg: '', msgType: '', shake: false, fresh: false, tool: 'keys', reveal: false,
  codeMode: false, codeRepeats: true, typing: false, peekCode: '',
  olist: null, og: null, ogId: null, oerr: '', busy: false, ocode: null, otab: 'mine', onotes: null, pushOk: false, joinPrefill: '' };

/* ---------- helpers ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const other = p => 1 - p;

let actx = null;

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  result(e, n) {

  turn() { tone(660, 0.1, 'sine', 0.07); tone(990, 0.16, 'sine', 0.07, 0.1); buzz([20, 50, 20]); },
  win() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, 'sine', 0.09, i * 0.1)); buzz([40, 60, 40, 60, 120]); },

/* ---------- modes, clocks, history ---------- */
const MODES = {
  classic: { name: 'Classic', desc: 'Take turns. First to crack the code wins — and if the player who went first cracks it, the other gets one last turn to tie.' },
  playout: { name: 'Play it out', desc: "Take turns until you've both cracked the code. Fewest guesses wins; the same number is a tie." },
  race: { name: 'Race', desc: 'No turns — you both guess at the same time with the clock running. First to crack the code wins.' },
  trial: { name: 'Time trial', desc: "Each player solves the other's code in turn with the clock running. Fastest time wins; fewer guesses breaks a tie." }
};
function modePicker(act, keys, cur) {
  return `<div class="field"><label>Mode</label>
    <div class="seg" style="margin:0">${keys.map(k => `<button data-act="${act}" data-v="${k}" class="${cur === k ? 'on' : ''}">${MODES[k].name}</button>`).join('')}</div>
    <small class="muted" style="line-height:1.45;font-size:13px">${MODES[cur].desc}</small></div>`;
}
const fmtTime = ms => {
  if (ms == null || !isFinite(ms)) return '—';
  const t = Math.max(0, ms), m = Math.floor(t / 60000), sec = Math.floor(t / 1000) % 60, d = Math.floor(t / 100) % 10;

};
// clocks are updated in place by a ticker, so the screen doesn't re-render every tenth of a second
const clockHtml = (start, end, off) => `<span class="clock" data-start="${start}" data-off="${off || 0}" ${end ? `data-end="${end}"` : ''}>${fmtTime((end || (Date.now() + (off || 0))) - start)}</span>`;

setInterval(() => {
  document.querySelectorAll('.clock').forEach(el => {
    const now = Date.now() + (+el.dataset.off || 0);
    el.textContent = fmtTime((el.dataset.end ? +el.dataset.end : now) - +el.dataset.start);
  });

    const left = +el.dataset.at - (Date.now() + (+el.dataset.off || 0));

let gameLog = LS.get('cb.history', []);
function recordGame(r) { r.t = Date.now(); gameLog.unshift(r); gameLog = gameLog.slice(0, 500); LS.set('cb.history', gameLog); }

/* ================= pass-the-phone game ================= */
function newGame(n0, n1, repeats, first, mode) {

  mode = mode || 'classic';
  settings.repeats = repeats; settings.ptpMode = mode; saveSettings();
  const starter = first === 2 ? (Math.random() < 0.5 ? 0 : 1) : first;
  game = { v: 1, mode, names: [n0, n1], repeats, starter, turn: starter, phase: 'cover', cover: { p: 0, then: 'code' },
    codes: ['', ''], guesses: [[], []], notes: [mkNotes(), mkNotes()], winner: null, pending: null,
    done: [null, null], time: [null, null], t0: [null, null] };

}
function rematch() {

  const g = game; const first = g.winner === null ? other(g.starter) : other(g.winner);
  newGame(g.names[0], g.names[1], g.repeats, first, g.mode);
}
function lockCode() {
  const c = entryStr();
  if (!c) return;
  if (!game.repeats && hasRepeat(c)) { flash('No repeated digits in this game.'); return; }
  const p = game.cover.p;
  game.codes[p] = c; sfx.lock();
  if (p === 0) game.cover = { p: 1, then: 'code' };
  else game.cover = { p: game.starter, then: game.mode === 'trial' ? 'solve' : 'play' };
  game.phase = 'cover'; saveGame(); resetEntry(); render();
}
function finishLocal(w, pending) {

  if (w !== null) { wins[game.names[w]] = (wins[game.names[w]] || 0) + 1; LS.set('cb.wins', wins); }
  recordGame({ kind: 'local', mode: game.mode || 'classic', names: game.names.slice(), winner: w === null ? null : game.names[w],
    counts: [game.guesses[0].length, game.guesses[1].length], ms: game.mode === 'trial' ? game.time.slice() : null });

function submitGuess() {
  const g = entryStr(); const p = game.turn;
  if (!g) { flash('Fill all 4 digits first.'); return; }
  if (game.guesses[p].some(x => x.g === g)) { flash('You already guessed ' + g + '.'); return; }
  const [e, n] = score(g, game.codes[other(p)]);
  game.guesses[p].push({ g, e, n });
  ui.fresh = true; resetEntry();
  const mode = game.mode || 'classic', cnt = game.guesses[p].length;

/* ================= online ================= */
async function rpc(fn, body) {
  let r;
  try {
    r = await fetch(API + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error("Can't reach the server — check your internet connection."); }
  const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) {
    const m = (j && j.message) || 'Something went wrong (' + r.status + ')';
    if (m === 'Unknown player') { me = null; LS.del('cb.me'); }
    throw new Error(m);
  }
  return j;
}
function notify(gameId, kind) {
  if (!me) return;
  fetch(API + '/functions/v1/cb-notify', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ secret: me.secret, game: gameId, kind }) }).catch(() => {});
}
const oppName = () => (ui.og && ui.og.names[other(ui.og.me)]) || 'Your opponent';
function yourAction(x) { return (x.status === 'play' && (x.mode === 'race' || x.turn === x.me)) || (x.status === 'codes' && !x.my_code_set); }
function yourTurnCount() { return (ui.olist || []).filter(yourAction).length; }
function updateBadge() {
  const n = yourTurnCount();
  try { if (navigator.setAppBadge) { n ? navigator.setAppBadge(n) : navigator.clearAppBadge(); } } catch (e) {}
}

/* turn alerts (web push) */
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const pushSupported = () => location.protocol === 'https:' && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function b64u(s) {
  const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
async function subscribePush() {
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(VAPID) });
  const j = sub.toJSON();
  await rpc('cb_push_add', { p_secret: me.secret, p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth });
  ui.pushOk = true;
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { render(); return; }
    await subscribePush(); sfx.lock();
  } catch (e) { ui.oerr = 'Could not turn on alerts: ' + e.message; }
  render();
}
function alertsCard() {
  if (location.protocol === 'file:')
    return `<div class="note"><b>Turn alerts</b> aren't available in this installed version — it checks for moves while it's open. For buzzes when the app is closed, install Codebreaker from <b>${SITE.replace('https://', '')}</b> in Chrome.</div>`;
  if (isIOS && !standalone())
    return `<div class="note"><b>Want a buzz when it's your turn?</b> Add Codebreaker to your Home Screen first: tap the <b>Share</b> button, then <b>Add to Home Screen</b>. Open it from the new icon and turn on alerts there.</div>`;
  if (!pushSupported()) return `<div class="note">This browser can't show turn alerts. The game still checks for moves while it's open.</div>`;
  if (Notification.permission === 'granted' && ui.pushOk) return `<div class="note">🔔 <b>Turn alerts are on.</b> You'll get a buzz when it's your move.</div>`;
  if (Notification.permission === 'denied')
    return `<div class="note"><b>Turn alerts are blocked.</b> Turn on notifications for Codebreaker in your phone's settings to get a buzz on your turn.</div>`;
  return `<div class="note"><b>Get a buzz when it's your turn</b> — even when the app is closed.<button class="btn primary" data-act="opush">Turn on turn alerts</button></div>`;
}

/* ---------- computer opponent: how it picks guesses ---------- */
const codeCache = {};
function allCodes(repeats) {
  const k = repeats ? 'r' : 'u';
  if (!codeCache[k]) {
    const out = [];
    for (let i = 0; i < 10000; i++) { const s = String(i).padStart(4, '0'); if (repeats || !hasRepeat(s)) out.push(s); }
    codeCache[k] = out;
  }
  return codeCache[k];
}
const pickRandom = a => a[Math.floor(Math.random() * a.length)];
function sample(a, n) {
  if (a.length <= n) return a;
  const b = a.slice();   // partial shuffle: first n items end up a random sample
  for (let i = 0; i < n; i++) { const j = i + Math.floor(Math.random() * (b.length - i)); const x = b[i]; b[i] = b[j]; b[j] = x; }
  return b.slice(0, n);
}
function randomCode(repeats) { return pickRandom(allCodes(repeats)); }
function aiPickGuess(level, clues, repeats) {
  const all = allCodes(repeats), done = new Set(clues.map(c => c.g));
  const fits = (code, list) => list.every(c => { const [e, n] = score(c.g, code); return e === c.e && n === c.n; });
  // easy & normal sometimes "forget" clues; how much they remember grows as the game goes on
  const sloppy = (wild, keep) => {
    if (Math.random() < wild) return pickRandom(all.filter(c => !done.has(c)));
    const remembered = clues.filter(() => Math.random() < keep);
    const cands = all.filter(c => !done.has(c) && fits(c, remembered));
    return cands.length ? pickRandom(cands) : pickRandom(all.filter(c => !done.has(c)));
  };
  const t = clues.length;
  if (level === 'easy') return sloppy(Math.max(0.1, 0.5 - 0.03 * t), Math.min(0.85, 0.2 + 0.04 * t));
  if (level === 'normal' && Math.random() < 0.6) return sloppy(0.05, Math.min(0.95, 0.5 + 0.05 * t));
  const cands = all.filter(c => fits(c, clues));
  if (!cands.length) return pickRandom(all.filter(c => !done.has(c)));   // only if a code changed mid-game
  if (level === 'normal' || cands.length <= 2) return pickRandom(cands);
  // hard: choose the possible code that splits the remaining possibilities most evenly
  if (!clues.length) return pickRandom(allCodes(false));
  // cap the work (~60k comparisons) so a move stays quick on a phone
  const pool = sample(cands, 150), test = sample(cands, 400);
  let best = null, bestScore = Infinity;
  for (const g of pool) {
    const buckets = new Array(25).fill(0);
    for (const s of test) { const [e, n] = score(g, s); buckets[e * 5 + n]++; }
    let sc = 0; for (const b of buckets) sc += b * b;
    if (sc < bestScore) { bestScore = sc; best = g; }
  }
  return best;
}

  const seg = `<div class="seg" style="margin:0">${[['all', 'All'], ['online', 'Online'], ['ai', 'Computer'], ['local', '1 phone']].map(([k, l]) => `<button data-act="sfilter" data-v="${k}" class="${f === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const head = `<div class="pagehead"><button class="iconbtn" data-act="home">‹</button><h2>Stats</h2></div>${seg}`;
  if (f === 'local') return `<div class="screen scroll"><div class="content">${head}${localStats()}</div></div>`;
  const loading = me && !ui.ohist && f !== 'ai' ? `<div class="note"><span class="spin"></span>Loading your online games…</div>` : '';
  const recs = myRecords(f);
  if (!recs.length) return `<div class="screen scroll"><div class="content">${head}${loading}
    ${loading ? '' : `<div class="note">No games here yet. ${f === 'online' && !me ? 'Play online to start your record.' : 'Finish a game and it shows up here.'}</div>`}</div></div>`;
  const t = tally(recs), n = recs.length, st = streaks(recs);
  const cracked = recs.filter(x => (x.result === 'win' || x.result === 'draw') && !x.resigned && x.mine > 0);
  const fewest = cracked.length ? Math.min(...cracked.map(x => x.mine)) : null;
  const avg = cracked.length ? (cracked.reduce((a, x) => a + x.mine, 0) / cracked.length).toFixed(1) : null;
  const raceWins = recs.filter(x => x.mode === 'race' && x.result === 'win' && x.ms);
  const fastest = raceWins.length ? Math.min(...raceWins.map(x => x.ms)) : null;
  const group = key => {
    const m = new Map();
    recs.forEach(x => { const k = key(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
    return [...m.entries()].sort((a, b) => b[1].length - a[1].length).map(([k, list]) => {
      const r = tally(list);
      return `<div class="srow"><div><b>${esc(k)}</b><small>${r.w} won · ${r.l} lost${r.d ? ` · ${r.d} tied` : ''}</small></div>${wlBar(r)}</div>`;
    }).join('');
  };
  const recent = recs.slice(0, 20).map(x => {
    const icon = x.result === 'win' ? '🏆' : x.result === 'draw' ? '🤝' : '·';
    const detail = x.resigned ? (x.result === 'win' ? 'they gave up' : 'you gave up') : x.mode === 'race' && x.ms ? `${fmtTime(x.ms)} · you ${x.mine}, them ${x.theirs}` : `you ${x.mine} · them ${x.theirs} guesses`;
    return `<div class="srow"><div><b>${icon} ${esc(x.opp)}</b><small>${MODES[x.mode || 'classic'].name} · ${detail}</small></div>
      <span class="badge ${x.result === 'win' ? 'go' : ''}">${x.result === 'win' ? 'Won' : x.result === 'draw' ? 'Tie' : 'Lost'}</span><small class="muted when">${whenText(x.t)}</small></div>`;
  }).join('');
  return `<div class="screen scroll"><div class="content">${head}${loading}
    <div class="stiles">
      ${statTile(n, n === 1 ? 'game' : 'games')}
      ${statTile(Math.round(t.w / n * 100) + '%', 'win rate')}
      ${statTile(`${t.w}–${t.l}${t.d ? '–' + t.d : ''}`, t.d ? 'won–lost–tied' : 'won–lost')}
      ${statTile(st.cur ? `🔥 ${st.cur}` : '0', 'win streak now')}
      ${statTile(st.best, 'best win streak')}
      ${statTile(fewest ?? '—', 'fewest guesses to crack')}
      ${statTile(avg ?? '—', 'average guesses to crack')}
      ${statTile(fastest ? fmtTime(fastest) : '—', 'fastest race win')}
    </div>
    <div class="sectionlabel">By opponent</div><div class="slist">${group(x => x.opp)}</div>
    <div class="sectionlabel">By mode</div><div class="slist">${group(x => MODES[x.mode || 'classic'].name)}</div>
    <div class="sectionlabel">Recent games</div><div class="slist">${recent}</div>
    ${ui.ohistErr ? `<div class="err">${esc(ui.ohistErr)}</div>` : ''}
  </div></div>`;
}
function localStats() {
  const recs = gameLog.filter(g => g.kind === 'local');
  const pairs = new Map();
  recs.forEach(g => {
    const key = g.names.slice().sort().join(' vs ');
    if (!pairs.has(key)) pairs.set(key, { names: g.names.slice().sort(), w: {}, d: 0, n: 0 });
    const p = pairs.get(key); p.n++;
    if (g.winner) p.w[g.winner] = (p.w[g.winner] || 0) + 1; else p.d++;
  });
  const h2h = [...pairs.values()].map(p => `<div class="srow"><div><b>${esc(p.names[0])} ${p.w[p.names[0]] || 0} – ${p.w[p.names[1]] || 0} ${esc(p.names[1])}</b>
    <small>${p.n} game${p.n === 1 ? '' : 's'}${p.d ? ` · ${p.d} tied` : ''}</small></div></div>`).join('');
  const recent = recs.slice(0, 20).map(g => {
    const detail = g.mode === 'trial' && g.ms ? g.ms.map((t, i) => `${esc(g.names[i])} ${isFinite(t) ? fmtTime(t) : '—'}`).join(' · ') : `${esc(g.names[0])} ${g.counts[0]} · ${esc(g.names[1])} ${g.counts[1]} guesses`;
    return `<div class="srow"><div><b>${g.winner ? `🏆 ${esc(g.winner)} won` : '🤝 Tie'}</b><small>${MODES[g.mode || 'classic'].name} · ${detail}</small></div><small class="muted when">${whenText(g.t)}</small></div>`;
  }).join('');
  const legacy = Object.keys(wins).length ? `<div class="note">All-time win tally on this phone (including games from before stats were added): ${Object.entries(wins).map(([k, v]) => `<b>${esc(k)}</b> ${v}`).join(' · ')}</div>` : '';
  if (!recs.length) return `<div class="note">No pass-the-phone games recorded yet. Finish one and it shows up here.</div>${legacy}`;
  return `<div class="sectionlabel">Head to head</div><div class="slist">${h2h}</div>
    <div class="sectionlabel">Recent games</div><div class="slist">${recent}</div>${legacy}`;
}

/* ---------- render ---------- */
function render() {
  ui.typing = false; ui.codeMode = false; ui.peekCode = '';
  let html;
  switch (ui.view) {
    case 'home': html = vHome(); break;
    case 'new': html = vNew(); break;
    case 'rules': html = vRules(); break;
    case 'settings': html = vSettings(); break;
    case 'review': html = vReview(); break;
    case 'online': html = vOnline(); break;
    case 'oName': html = vOName(); break;
    case 'oNew': html = vONew(); break;
    case 'oJoin': html = vOJoin(); break;
    case 'oCode': html = vOCode(); break;
    case 'oGame': html = vOGame(); break;
    case 'oReview': html = ui.og ? vOReview() : vOGame(); break;
    case 'aNew': html = vANew(); break;
    case 'stats': html = vStats(); break;
    case 'aGame': html = vAGame(); break;
    case 'aReview': html = ai ? reviewScreen(ai.names, ai.codes, ai.guesses, 'aback') : vANew(); break;
    default:
      if (!game) { ui.view = 'home'; html = vHome(); break; }
      if (game.phase === 'cover') html = vCover();
      else if (game.phase === 'code') html = vCode();
      else if (game.phase === 'over' && !game.pending) html = vOver();
      else html = vPlay();
  }
  html += vSheet();
  // keep whatever the player was typing in a text box across re-renders
  const f = document.activeElement && document.activeElement.id && document.activeElement.tagName === 'INPUT' ? document.activeElement : null;
  const keep = f ? { id: f.id, v: f.value, s: f.selectionStart } : null;
  $app.innerHTML = html;
  if (keep) { const n = document.getElementById(keep.id); if (n) { n.value = keep.v; n.focus(); try { n.setSelectionRange(keep.s, keep.s); } catch (e) {} } }
  const h = document.getElementById('hist'); if (h) h.scrollTop = h.scrollHeight;
  bindPeek();
  if (ui.view === 'aGame') aiScheduleMove();
}
function showBanner(text, color) {
  const b = document.createElement('div'); b.className = 'banner';
  b.innerHTML = `<div style="color:${color}">${text}</div>`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 1400);
}
function confetti() {
  const c = document.createElement('div'); c.className = 'confetti';
  const cols = ['#2ee59d', '#ffb547', '#5cc8ff', '#ff7ac6', '#ffffff'];
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('i');
    s.style.left = Math.random() * 100 + 'vw';
    s.style.background = cols[i % cols.length];
    s.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    s.style.animationDelay = Math.random() * 0.6 + 's';
    s.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    c.appendChild(s);
  }
  document.body.appendChild(c); setTimeout(() => c.remove(), 4500);
}
function bindPeek() {
  const b = document.getElementById('peek'); if (!b || !ui.peekCode) return;
  const code = ui.peekCode;
  const show = e => { e.preventDefault(); b.textContent = code; b.classList.add('on'); };
  const hide = () => { b.textContent = 'My code'; b.classList.remove('on'); };
  b.addEventListener('pointerdown', show);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, hide));
  b.addEventListener('contextmenu', e => e.preventDefault());
}

/* ---------- actions ---------- */
function goOnline() {
  ui.oerr = ''; ui.view = me ? 'online' : 'oName'; render(); loadList();
}
function act(a, d) {
  switch (a) {
    case 'home': ui.view = 'home'; ui.sheet = null; ui.oerr = ''; loadList(); break;
    case 'continue': ui.view = 'game'; resetEntry(); break;
    case 'new': ui.view = 'new'; ui.first = 0; break;
    case 'rules': ui.back = ui.view; ui.sheet = null; ui.view = 'rules'; break;
    case 'settings': ui.back = ui.view; ui.sheet = null; ui.view = 'settings'; break;
    case 'goback': ui.view = ui.back || 'home'; ui.oerr = ''; if (ui.view === 'oGame') loadGame(true); break;
    case 'toggleNewRep': saveNames(); settings.repeats = !settings.repeats; saveSettings(); break;
    case 'first': saveNames(); ui.first = +d.v; break;
    case 'start': {
      const n0 = (document.getElementById('n0').value || '').trim() || 'Player 1';
      let n1 = (document.getElementById('n1').value || '').trim() || 'Player 2';
      if (n1.toLowerCase() === n0.toLowerCase()) n1 += ' 2';
      newGame(n0, n1, settings.repeats, ui.first === undefined ? 0 : ui.first, settings.ptpMode || 'classic'); return;
    }
    case 'ptpmode': saveNames(); settings.ptpMode = d.v; saveSettings(); break;
    case 'treveal': ui.sheet = null; revealLocal(); return;
    case 'uncover':
      if (game.cover.then === 'solve') {        // time trial: the clock starts now
        game.phase = 'play'; game.turn = game.cover.p; game.t0[game.turn] = Date.now(); resetEntry(); saveGame(); render();
        showBanner('Go!', 'var(--hit)'); sfx.turn(); return;
      }
      game.phase = game.cover.then; if (game.phase === 'play') game.turn = game.starter;
      resetEntry(); saveGame();
      if (game.phase === 'play') { render(); showBanner(esc(game.names[game.turn]) + "'s turn", pColor(game.turn)); return; }
      break;
    case 'key': press(+d.d); return;
    case 'bksp': backspace(); return;
    case 'slot': ui.cursor = +d.i; break;
    case 'go':
      if (ui.view === 'game') { game.phase === 'code' ? lockCode() : submitGuess(); }
      else if (ui.view === 'oCode' || (ui.view === 'oGame' && ui.og && ui.og.status === 'codes')) oLock();
      else if (ui.view === 'oGame') oGuess();
      else if (ui.view === 'aGame') { ai.phase === 'code' ? aiLock() : aiGuess(); }
      return;
    case 'reveal': ui.reveal = !ui.reveal; break;
    case 'pass': passTurn(); return;
    case 'note': { const b = curBoard(); if (!b) return; const n = b.notes.digits; n[+d.d] = (n[+d.d] + 1) % 3; b.save(); buzz(6); break; }
    case 'cell': { const b = curBoard(); if (!b) return; const g = b.notes.grid; g[+d.i] = (g[+d.i] + 1) % 3; b.save(); buzz(6); break; }
    case 'clearnotes': { const b = curBoard(); if (!b) return; b.notes.digits.fill(0); b.notes.grid.fill(0); b.save(); break; }
    case 'tool': ui.tool = d.v; break;
    case 'menu': ui.sheet = 'menu'; break;
    case 'closesheet': ui.sheet = null; break;
    case 'homekeep': ui.sheet = null; ui.view = 'home'; break;
    case 'quit': ui.sheet = 'confirm'; break;
    case 'quityes': game = null; saveGame(); ui.sheet = null; ui.view = 'home'; break;
    case 'rematch': rematch(); return;
    case 'review': ui.view = 'review'; break;
    case 'backover': ui.view = 'game'; break;
    case 'set': settings[d.k] = !settings[d.k]; saveSettings(); break;
    case 'resetwins': wins = {}; LS.set('cb.wins', wins); break;

    case 'stats': ui.view = 'stats'; ui.sfilter = ui.sfilter || 'all'; render(); loadStats(); return;
    case 'sfilter': ui.sfilter = d.v; break;

    /* vs computer */
    case 'ai': if (ai && ai.phase !== 'over') { ui.view = 'aGame'; resetEntry(); ui.otab = 'mine'; } else { ui.view = 'aNew'; ui.first = 0; } break;
    case 'alevel': settings.aiLevel = d.v; saveSettings(); break;
    case 'astart': aiNewGame(settings.aiLevel || 'normal', settings.repeats, ui.first === undefined ? 0 : ui.first, settings.aiMode || 'classic'); return;
    case 'amode': settings.aiMode = d.v; saveSettings(); break;
    case 'amenu': ui.sheet = 'amenu'; break;
    case 'aresign': ui.sheet = 'aresign'; break;
    case 'aresignyes': ai.resigned = true; aiFinish(1); saveAi(); ui.sheet = null; sfx.lose(); break;
    case 'arematch': aiNewGame(ai.level, ai.repeats, ai.winner === null ? other(ai.starter) : ai.winner === 0 ? 1 : 0, ai.mode); return;
    case 'anew': ui.view = 'aNew'; ui.first = 0; break;
    case 'areview': ui.view = 'aReview'; break;
    case 'aback': ui.view = 'aGame'; break;

    /* online */
    case 'online': goOnline(); return;
    case 'oname': ui.back = ui.view; ui.view = 'oName'; ui.oerr = ''; break;
    case 'osavename': {
      const n = (document.getElementById('oname').value || '').trim();
      if (!n) { ui.oerr = 'Type a name first.'; break; }
      withBusy(async () => {
        if (me) { await rpc('cb_rename', { p_secret: me.secret, p_name: n }); me.name = n; }
        else { const r = await rpc('cb_register', { p_name: n }); me = { id: r.id, secret: r.secret, name: n }; }
        LS.set('cb.me', me); ui.view = ui.joinPrefill ? 'oJoin' : 'online'; ui.olist = null; loadList(); refreshPush();
      });
      return;
    }
    case 'opush': enablePush(); return;
    case 'onew': ui.view = 'oNew'; ui.oerr = ''; break;
    case 'onewgo': ui.ocode = { mode: 'create', repeats: settings.repeats, gmode: settings.onlineMode || 'classic' }; resetEntry(); ui.view = 'oCode'; break;
    case 'omode': settings.onlineMode = d.v; saveSettings(); break;
    case 'ojoin': ui.view = 'oJoin'; ui.oerr = ''; break;
    case 'ojoingo': {
      const jc = (document.getElementById('ojoin').value || '').trim().toUpperCase();
      ui.joinPrefill = jc;
      if (jc.length !== 5) { ui.oerr = 'Join codes are 5 characters.'; break; }
      withBusy(async () => {
        const r = await rpc('cb_lookup', { p_secret: me.secret, p_join: jc });
        ui.joinPrefill = '';
        if (r.joined) { ui.busy = false; openGame(r.id); return; }
        ui.ocode = { mode: 'join', join: jc, host: r.host, repeats: r.repeats, gmode: r.mode || 'classic' }; resetEntry(); ui.view = 'oCode';
      });
      return;
    }
    case 'oopen': openGame(d.id); return;
    case 'olist': ui.sheet = null; ui.view = 'online'; ui.ogId = null; ui.og = null; ui.oerr = ''; render(); loadList(); return;
    case 'oback': ui.view = 'oGame'; break;
    case 'otab': ui.otab = d.v; break;
    case 'omenu': ui.sheet = 'omenu'; break;
    case 'oresign': ui.sheet = 'oresign'; break;
    case 'oresignyes': {
      const id = ui.og.id; ui.sheet = null;
      withBusy(async () => { await rpc('cb_resign', { p_secret: me.secret, p_game: id }); notify(id, 'resign'); ui.busy = false; await loadGame(true); });
      return;
    }
    case 'ocancel': {
      const id = ui.og.id;
      withBusy(async () => { await rpc('cb_hide', { p_secret: me.secret, p_game: id }); ui.busy = false; act('olist', {}); });
      return;
    }
    case 'oshare': shareInvite(); return;
    case 'oreview': ui.view = 'oReview'; break;
    case 'orematch': {
      const st = ui.og;
      if (st.rematch_id) { openGame(st.rematch_id); return; }
      withBusy(async () => { const id = await rpc('cb_rematch', { p_secret: me.secret, p_game: st.id }); notify(id, 'rematch'); ui.busy = false; openGame(id); });
      return;
    }
    default: return;
  }
  render();
}
function saveNames() {
  const a = document.getElementById('n0'), b = document.getElementById('n1');
  if (a && b) { names = [a.value, b.value]; }
}
$app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  // taps inside a sheet should not trigger the veil's close
  if (t.classList.contains('veil') && e.target.closest('[data-stop]')) return;
  act(t.dataset.act, t.dataset);
});
// physical keyboard support (handy on a desktop / with a keyboard cover)
document.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') {
    if (e.key === 'Enter') { if (e.target.id === 'oname') act('osavename', {}); if (e.target.id === 'ojoin') act('ojoingo', {}); }
    return;
  }
  if (!ui.typing || ui.sheet) return;
  if (/^[0-9]$/.test(e.key)) press(+e.key);
  else if (e.key === 'Backspace') backspace();
  else if (e.key === 'Enter') act('go', {});
});

/* Android back button: return true if handled inside the game */
window.cbBack = function () {
  if (ui.sheet) { ui.sheet = null; render(); return true; }
  switch (ui.view) {
    case 'rules': case 'settings': case 'oName': act(me || ui.view !== 'oName' ? 'goback' : 'home', {}); return true;
    case 'new': act('home', {}); return true;
    case 'review': act('backover', {}); return true;
    case 'online': act('home', {}); return true;
    case 'oNew': case 'oJoin': case 'oCode': case 'oGame': act('olist', {}); return true;
    case 'oReview': act('oback', {}); return true;
    case 'aNew': case 'stats': act('home', {}); return true;
    case 'aReview': act('aback', {}); return true;
    case 'aGame':
      if (ai && ai.phase !== 'over') { ui.sheet = 'amenu'; render(); return true; }
      act('home', {}); return true;
    case 'game':
      if (game && (game.phase === 'play' || game.phase === 'code')) { ui.sheet = 'menu'; render(); return true; }
      act('home', {}); return true;
  }
  return false;
};

/* ---------- background refresh ---------- */
function tick() {
  if (document.hidden || !me) return;
  if (ui.view === 'oGame' && !ui.busy) loadGame();
  else if (ui.view === 'online' || ui.view === 'home') loadList();
}
setInterval(tick, 3000);
setInterval(() => {   // live races refresh every second
  if (!document.hidden && me && ui.view === 'oGame' && !ui.busy && ui.og && ui.og.mode === 'race' && ui.og.status === 'play') loadGame();
}, 1000);
document.addEventListener('visibilitychange', tick);
async function refreshPush() {
  // quietly keep this phone's alert subscription registered
  if (!me || !pushSupported() || Notification.permission !== 'granted') return;
  try { await subscribePush(); if (ui.view === 'online') render(); } catch (e) {}
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    const m = e.data || {};
    if (m.open && me) openGame(m.open); else tick();
  });
}

/* ---------- start ---------- */
(function start() {
  const h = location.hash;
  const g = /#g=([0-9a-f-]{36})/.exec(h), j = /#join=([A-Za-z0-9]{5})/.exec(h);
  if (h) try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (g && me) { openGame(g[1]); }
  else if (j) { ui.joinPrefill = j[1].toUpperCase(); ui.view = me ? 'oJoin' : 'oName'; render(); }
  else render();
  loadList(); refreshPush();
})();
</script>
